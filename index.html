<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Арсенал диспута · Аргументы и контрдоводы</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#0b0d14;--panel:#121522;--panel2:#171b2b;--line:#252a3d;--txt:#dfe3f0;--mute:#8a91a8;--acc:#8b7cff}
body.light{--bg:#f4f5fa;--panel:#ffffff;--panel2:#f7f8fc;--line:#e2e5ef;--txt:#1d2133;--mute:#677089;--acc:#5b4cf0}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;font:16px/1.65 "Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt)}
a{color:var(--acc)}
.wrap{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:22px 16px}
.brand{font-weight:800;font-size:20px;letter-spacing:.2px;margin:0 6px 4px}
.brand span{background:linear-gradient(90deg,#8b7cff,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:13px;margin:0 6px 16px}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14px;outline:none}
.search:focus{border-color:var(--acc)}
.tools{display:flex;gap:6px;margin:10px 0 16px}
.tools button{flex:1;padding:7px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font-size:12px}
.tools button:hover{border-color:var(--acc)}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--txt);font-size:14px;border-left:3px solid transparent}
nav a:hover,nav a.on{background:var(--panel2);border-left-color:var(--c)}
nav a b{font-weight:500;flex:1}
nav a i{font-style:normal;font-size:12px;color:var(--mute);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:0 8px}
.legend{margin-top:18px;padding:12px;border:1px dashed var(--line);border-radius:10px;font-size:12px;color:var(--mute)}
.legend div{margin:4px 0}
main{padding:34px 48px 80px;max-width:1080px}
.hero{padding:28px 30px;border-radius:18px;background:radial-gradient(circle at 0 0,rgba(139,124,255,.25),transparent 55%),radial-gradient(circle at 100% 100%,rgba(56,189,248,.18),transparent 50%),var(--panel);border:1px solid var(--line);margin-bottom:28px}
.hero h1{margin:0 0 6px;font-size:30px}
.hero p{margin:0;color:var(--mute)}
.stats{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.stats div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px;color:var(--mute)}
.stats b{display:block;color:var(--txt);font-size:20px}
.cat{margin:40px 0 0}
.cat>header{display:flex;gap:14px;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--c)}
.cat .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.cat h2{margin:0;font-size:22px}
.cat header p{margin:0;color:var(--mute);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden;transition:border-color .2s}
.card[open]{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.card summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 18px}
.card summary::-webkit-details-marker{display:none}
.card summary:hover{background:var(--panel2)}
.num{font-size:11px;font-weight:700;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);border-radius:6px;padding:2px 7px;white-space:nowrap}
.ttl{flex:1;font-weight:600}
.lvl{font-size:11px;border-radius:20px;padding:2px 9px;white-space:nowrap}
.l1{background:rgba(52,211,153,.15);color:#34d399}.l2{background:rgba(250,204,21,.15);color:#eab308}.l3{background:rgba(244,114,182,.15);color:#ec4899}
.chev{color:var(--mute);transition:transform .2s}
.card[open] .chev{transform:rotate(180deg)}
.body{padding:4px 24px 20px;border-top:1px solid var(--line)}
.ask{margin:16px 0 6px;padding:10px 14px;border-radius:12px;background:var(--panel2);border-left:3px solid var(--c);color:var(--mute);font-size:14px}
.ask-l{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--c);font-weight:700;margin-bottom:2px}
.ask.long{max-height:92px;overflow:hidden;position:relative;cursor:pointer}
.ask.long::after{content:"показать полностью ▾";position:absolute;right:0;bottom:0;left:0;padding:24px 14px 6px;text-align:right;font-size:12px;color:var(--c);background:linear-gradient(transparent,var(--panel2) 60%)}
.ask.long.full{max-height:none}.ask.long.full::after{display:none}
.ans h4{font-size:17px;margin:22px 0 8px;color:var(--txt);padding-left:10px;border-left:3px solid var(--c)}
.ans ul,.ans ol{padding-left:22px}
.ans li{margin:6px 0}
.ans li::marker{color:var(--c)}
.li-cont{margin-top:4px;color:var(--txt)}
.ans strong{color:color-mix(in srgb,var(--c) 35%,var(--txt))}
.ans em{color:var(--mute)}
.ans code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.9em}
blockquote{margin:16px 0;padding:12px 16px;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,transparent),transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
blockquote p{margin:4px 0;font-style:italic}
.q-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--c);margin-bottom:4px}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}
mark{background:rgba(250,204,21,.4);color:inherit;border-radius:3px}
.hidden{display:none!important}
.empty{color:var(--mute);text-align:center;padding:40px}
#top{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:18px;cursor:pointer}
@media(max-width:900px){.wrap{grid-template-columns:1fr}aside{position:relative;height:auto}main{padding:20px 14px 60px}}
@media print{aside,#top,#gate{display:none!important}.wrap{display:block}.card{break-inside:avoid}details>.body{display:block}}
#gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,rgba(139,124,255,.18),transparent 45%),radial-gradient(circle at 80% 80%,rgba(56,189,248,.14),transparent 45%),var(--bg)}
.gate-box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.gate-ico{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(139,124,255,.15);margin-bottom:14px}
.gate-box h1{margin:0 0 6px;font-size:22px}
.gate-box p{margin:0 0 18px;color:var(--mute);font-size:14px}
.gate-box input[type=password],.gate-box input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:15px;outline:none}
.gate-box input:focus{border-color:var(--acc)}
.gate-row{display:flex;align-items:center;justify-content:space-between;margin:12px 0 16px;font-size:13px;color:var(--mute)}
.gate-row label{display:flex;align-items:center;gap:7px;cursor:pointer}
.gate-btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.gate-btn:disabled{opacity:.6;cursor:wait}
.gate-err{margin-top:12px;color:#f87171;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div id="gate">
  <form class="gate-box" id="gf">
    <div class="gate-ico">🔒</div>
    <h1>Доступ по паролю</h1>
    <p>Содержимое страницы зашифровано (AES-256-GCM). Введите пароль, чтобы расшифровать материалы.</p>
    <input type="password" id="gp" placeholder="Пароль" autocomplete="current-password" required autofocus>
    <div class="gate-row">
      <label><input type="checkbox" id="grem" checked> Запомнить в этом браузере</label>
      <button type="button" id="gshow" style="background:none;border:0;color:var(--acc);cursor:pointer;font-size:13px">Показать</button>
    </div>
    <button class="gate-btn" id="gbtn" type="submit">Войти</button>
    <div class="gate-err" id="gerr"></div>
  </form>
</div>
<div id="app" class="hidden"></div>

if(localStorage.theme==='l')document.body.classList.add('light');
gshow.onclick=()=>{gp.type=gp.type==='password'?'text':'password';gshow.textContent=gp.type==='password'?'Показать':'Скрыть'};

function b64(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function decryptWith(pass){
  if(!window.crypto||!crypto.subtle)throw new Error('NO_CRYPTO');
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.s),iterations:PAYLOAD.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.d));
  return new TextDecoder().decode(buf);
}

function initApp(){
  const cards=[...document.querySelectorAll('.card')], secs=[...document.querySelectorAll('.cat')];
  document.querySelectorAll('.ask.long').forEach(a=>a.onclick=()=>a.classList.toggle('full'));
  ex.onclick=()=>cards.forEach(c=>{if(!c.classList.contains('hidden'))c.open=true});
  co.onclick=()=>cards.forEach(c=>c.open=false);
  th.onclick=()=>{document.body.classList.toggle('light');localStorage.theme=document.body.classList.contains('light')?'l':'d'};
  lk.onclick=()=>{sessionStorage.removeItem('dg_p');localStorage.removeItem('dg_p');location.reload()};
  const renderMath=()=>{if(window.renderMathInElement)renderMathInElement(document.querySelector('main'),{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});cards.forEach(c=>{c.dataset.t=c.textContent.toLowerCase()})};
  cards.forEach(c=>{c.dataset.t=c.textContent.toLowerCase()});
  if(window.renderMathInElement)renderMath();else window.addEventListener('load',renderMath);
  function clearMarks(){document.querySelectorAll('mark').forEach(m=>m.replaceWith(m.textContent));}
  function markIn(el,w){const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const ns=[];while(tw.nextNode()){const n=tw.currentNode;if(n.parentElement.closest('.katex,script'))continue;if(n.nodeValue.toLowerCase().includes(w))ns.push(n)}
   ns.forEach(n=>{const i=n.nodeValue.toLowerCase().indexOf(w);const r=document.createRange();r.setStart(n,i);r.setEnd(n,i+w.length);const m=document.createElement('mark');r.surroundContents(m)})}
  let tm;q.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{const w=q.value.trim().toLowerCase();clearMarks();let any=0;
   cards.forEach(c=>{const hit=!w||c.dataset.t.includes(w);c.classList.toggle('hidden',!hit);if(w&&hit){c.open=true;markIn(c,w);any++}else if(!w)c.open=c.closest('#c-summary')!=null;});
   secs.forEach(s=>s.classList.toggle('hidden',!!w&&!s.querySelector('.card:not(.hidden)')));
   none.classList.toggle('hidden',!w||any>0)},200)};
  const links=[...document.querySelectorAll('nav a')];
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle('on',l.getAttribute('href')==='#'+e.target.id))}}),{rootMargin:'-20% 0px -70% 0px'});
  secs.forEach(s=>io.observe(s));
}

async function unlock(pass,save){
  gbtn.disabled=true;gerr.textContent='';
  try{
    const html=await decryptWith(pass);
    if(save)localStorage.setItem('dg_p',pass);else sessionStorage.setItem('dg_p',pass);
    app.innerHTML=html;app.classList.remove('hidden');gate.remove();initApp();
  }catch(e){
    localStorage.removeItem('dg_p');sessionStorage.removeItem('dg_p');
    gerr.textContent=e.message==='NO_CRYPTO'?'Откройте страницу через HTTPS или localhost (Web Crypto недоступен).':'Неверный пароль';
    gbtn.disabled=false;gp.focus();gp.select();
  }
}
gf.onsubmit=e=>{e.preventDefault();unlock(gp.value,grem.checked)};
const saved=sessionStorage.getItem('dg_p')||localStorage.getItem('dg_p');
if(saved)unlock(saved,!!localStorage.getItem('dg_p'));
</script>
